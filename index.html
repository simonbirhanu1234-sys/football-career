function easierUCLDraw(){
 const available=UCL_CLUBS.map((_,i)=>i);
 const rating=i=>{const c=UCL_CLUBS[i];return (c.atk+c.mid+c.def)/3};
 const userRating=strengthForClub(career.club);
 const picks=[];
 for(let round=0;round<8;round++){
   const candidates=available.filter(i=>!picks.includes(i));
   const weighted=candidates.map(i=>{
     const r=rating(i);
     const easier=Math.max(0,userRating-r);
     // Very strong bias toward the lower-rated half, so the league phase is
     // substantially easier while still allowing a couple of tougher tests.
     let w=(r<=80?24:1)+easier*1.2;
     if(round<6 && r<=80)w+=16;
     return {i,w};
   });
   const total=weighted.reduce((sum,x)=>sum+x.w,0);
   let roll=Math.random()*total;
   let chosen=weighted[weighted.length-1].i;
   for(const x of weighted){roll-=x.w;if(roll<=0){chosen=x.i;break;}}
   picks.push(chosen);
 }
 return picks;
}
function strengthForClub(i){
 const c=CLUBS[i];
 return c?(c.atk+c.mid+c.def)/3:80;
}

   save();

function simulateLeagueRound(round,skipFixture){

   if(g.played || g.home===career.club || g.away===career.club) return;
   const hs=simScoreFor(g.home,g.away), as=simScoreFor(g.away,g.home);

function simScoreFor(home,away){
 const diff=strength(home)-strength(away)+3;

}
function applyTableResult(home,away,hs,as){
 const h=career.table[home],a=career.table[away]; h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
 if(hs>as){h.w++;h.pts+=3;a.l++;} else if(hs<as){a.w++;a.pts+=3;h.l++;} else {h.d++;a.d++;h.pts++;a.pts++;}
}

function finalizeUCLLeaguePhase(){
 const q=career.champions;
 if(!q.qualified||q.played<8||q.rank!==null)return;
 // Simulate the wider 36-club league table around the user's points total.
 // The game uses points first and goal difference as the tie-break, matching the
 // competition's table logic closely enough for career mode progression.
 const others=[];
 for(let i=0;i<35;i++){
   const pts=Math.max(3,Math.min(22,Math.round(11+(Math.random()-.5)*10)));
   const gd=Math.round((Math.random()-.5)*16);
   others.push({pts,gd});
 }
 others.push({pts:q.pts,gd:q.gf-q.ga,user:true});
 others.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
 q.rank=others.findIndex(x=>x.user)+1;
 const pool=UCL_CLUBS.map((_,i)=>i);
 if(q.rank<=8){
   const op=pool[Math.floor(Math.random()*pool.length)];
   q.knockout={stage:'Round of 16',leg:1,op,agg:0,done:false};
   q.phase.push({knockout:true,stage:'Round of 16',leg:1,op,home:true,played:false,score:null,result:null});
   career.inbox.push(`Champions League: ${q.rank}${q.rank===1?'st':q.rank===2?'nd':q.rank===3?'rd':'th'} — straight to the Round of 16.`);
 }else if(q.rank<=24){
   const op=pool[Math.floor(Math.random()*pool.length)];
   q.knockout={stage:'Knockout Play-off',leg:1,op,agg:0,done:false};
   q.phase.push({knockout:true,stage:'Knockout Play-off',leg:1,op,home:true,played:false,score:null,result:null});
   career.inbox.push(`Champions League: ${q.rank}th — you reached the knockout phase play-off. Win the two-leg tie to reach the Round of 16.`);
 }else{
   q.eliminated=true;
   q.knockout={stage:'Eliminated',leg:0,op:null,agg:0,done:true};
   career.inbox.push(`Champions League: ${q.rank}th — eliminated after the league phase. The knockout phase is no longer available this season.`);
 }
}
function simulateUCL(){
 const q=career.champions;if(!q.qualified||q.played>=q.phase.length||q.eliminated)return;
 const f=q.phase[q.played];
 if(f.knockout)return playUCLKnockout();
 const me=CLUBS[career.club],op=UCL_CLUBS[f.op],t=career.tactics||{};
 let diff=avg()*.72+me.atk*.11+me.mid*.09+me.def*.08-(op.atk+op.mid+op.def)/3+(f.home?2.5:-1.5);
 if(t.mentality==='Attacking')diff+=3;if(t.mentality==='Defensive')diff-=1;if(t.press==='High')diff+=2;
 const xg=Math.max(.45,Math.min(2.8,1.25*Math.exp(diff/35))),oxg=Math.max(.4,Math.min(2.5,1.1*Math.exp(-diff/37)));
 const a=Math.min(6,poisson(xg)),b=Math.min(6,poisson(oxg));
 f.played=true;f.score=`${a}-${b}`;f.result=a>b?'W':a<b?'L':'D';q.played++;q.gf+=a;q.ga+=b;
 if(a>b){q.wins++;q.pts+=3}else if(a<b){q.losses++}else{q.draws++;q.pts++}
 career.inbox.push(`Champions League: ${f.result} ${a}-${b} vs ${op.name}.`);
 if(q.played===8)finalizeUCLLeaguePhase();
 save();render();
}

function makeResult(f,hs,as,simulated){
 f.played=true;f.score=`${hs}-${as}`;f.result=hs>as?"W":hs<as?"L":"D";
 applyTableResult(career.club,f.op,hs,as);
 if(hs>as){career.wins++;career.points+=3} else if(hs<as){career.losses++} else {career.draws++;career.points++}

 if(career.leagueSchedule?.[f.round]){
   const own=career.leagueSchedule[f.round].find(g=>(g.home===career.club&&g.away===f.op)||(g.away===career.club&&g.home===f.op));
   if(own){own.played=true;own.score=`${hs}-${as}`;}
   simulateLeagueRound(f.round,f);
 }
 career.inbox.push(`${simulated?"Simulated ":""}${f.result==="W"?"Win":f.result==="L"?"Loss":"Draw"} ${hs}-${as} vs ${CLUBS[f.op].name}.`);
 maybeQualify(); save();page="dashboard";render();
}

function poisson(lambda){
 let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<10);return Math.max(0,k-1)
}
function simulateNext(){
 const f=nextFixture();if(!f)return;
 const me=CLUBS[career.club],op=CLUBS[f.op];
 const my=(avg()*.78+me.atk*.10+me.mid*.07+me.def*.05);
 const opp=(op.atk+op.mid+op.def)/3;
 let diff=my-opp+(f.home?2.5:-2.5);

function playerPositionFit(pl,slot){
 const pos=String(pl?.pos||'').toUpperCase(),s=String(slot||'').toUpperCase();
 if(s==='GK')return pos==='GK'?100:0;
 if(s==='LB')return pos==='LB'?100:(pos==='CB'?72:0);
 if(s==='RB')return pos==='RB'?100:(pos==='CB'?72:0);
 if(s==='CB')return pos==='CB'?100:(['LB','RB','LWB','RWB'].includes(pos)?58:0);
 if(s==='LWB')return pos==='LWB'?100:(pos==='LB'?92:(pos==='LW'?55:(pos==='CB'?40:0)));
 if(s==='RWB')return pos==='RWB'?100:(pos==='RB'?92:(pos==='RW'?55:(pos==='CB'?40:0)));
 if(s==='DM')return pos==='DM'?100:(pos==='CM'?82:(pos==='AM'||pos==='CAM'?45:0));
 if(s==='CM')return pos==='CM'?100:(pos==='DM'?90:(pos==='AM'||pos==='CAM'?82:0));
 if(s==='LM')return pos==='LM'?100:(pos==='LW'?92:(pos==='CM'||pos==='AM'?65:0));
 if(s==='RM')return pos==='RM'?100:(pos==='RW'?92:(pos==='CM'||pos==='AM'?65:0));
 if(s==='LW')return pos==='LW'?100:(pos==='RW'?76:(pos==='AM'||pos==='CAM'?68:0));
 if(s==='RW')return pos==='RW'?100:(pos==='LW'?76:(pos==='AM'||pos==='CAM'?68:0));
 if(s==='AM'||s==='CAM')return (pos==='AM'||pos==='CAM')?100:(pos==='CM'?84:(pos==='LW'||pos==='RW'?58:0));
 if(s==='ST'||s==='FWD')return (pos==='FWD'||pos==='ST')?100:(pos==='LW'||pos==='RW'?66:(pos==='AM'||pos==='CAM'?60:0));
 return 0;
}
function playerPosMatches(pl,slot){return playerPositionFit(pl,slot)>0;}
function chooseBestForSlot(players,slot,used){
 const candidates=players.filter(p=>p&&!used.has(p.name)&&playerPositionFit(p,slot)>0);
 candidates.sort((a,b)=>playerPositionFit(b,slot)-playerPositionFit(a,slot)||b.ov-a.ov);
 return candidates[0]||null;
}
