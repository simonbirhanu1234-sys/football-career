function _guessPos(name){
  if(_posHints[name]) return _posHints[name];
  const n=String(name).toLowerCase();
  if(_defWords.some(x=>n.includes(x.toLowerCase()))) return "CB";
  if(_fwdWords.some(x=>n.includes(x.toLowerCase()))) return "FWD";
  if(_midWords.some(x=>n.includes(x.toLowerCase()))) return "CM";
  return "CM";
}
function _stableNum(name,club){
  let h=0,s=String(name)+"|"+club;
  for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0;
  return Math.abs(h);
}
for(const [club,names] of Object.entries(FULL_SQUADS)){
  const c=CLUBS.find(x=>x.name===club);
  if(!c) continue;
  const base=Math.round((c.atk+c.mid+c.def)/3);
  for(const name of names){
    const clean=String(name).trim();
    if(!clean||_existingPlayerNames.has(clean.toLowerCase())) continue;
    const h=_stableNum(clean,club);
    const ov=Math.max(62,Math.min(88,base-7+(h%15)));
    const age=18+(h%14);
    const value=Math.max(2,Math.round((ov-55)*(ov-55)/7));
    PLAYER_POOL.push([clean,_guessPos(clean),ov,value,club]);
    _existingPlayerNames.add(clean.toLowerCase());
  }
}
function _fullSquadRepair(){
  if(!career)return;
  const clubName=CLUBS[career.club]?.name;
  const sold=new Set((career.soldPlayers||[]).map(n=>String(n).trim().toLowerCase()));
  const base=PLAYER_POOL.filter(x=>x[4]===clubName);
  const current=new Map((career.players||[]).filter(p=>p&&p.name).map(p=>[String(p.name).toLowerCase(),p]));
  const merged=[];
  for(const x of base){
    const key=String(x[0]).toLowerCase();
    if(sold.has(key)) continue;
    if(current.has(key)) merged.push(current.get(key));
    else {
      const h=_stableNum(x[0],clubName);
      merged.push({name:x[0],pos:x[1],ov:x[2],value:x[3],morale:80,age:18+(h%14)});
    }
  }
  for(const p of current.values()){
    if(!base.some(x=>String(x[0]).toLowerCase()===String(p.name).toLowerCase())&&!sold.has(String(p.name).toLowerCase())) merged.push(p);
  }
  career.players=merged;
}

function makeFixtures(){
 const ids=DOMESTIC_CLUB_IDS.slice();
 let arr=ids.slice();
 if(arr.length%2) arr.push(null);
 const n=arr.length, rounds=[];
 for(let r=0;r<n-1;r++){
   const games=[];
   for(let k=0;k<n/2;k++){
     const a=arr[k],b=arr[n-1-k]; if(a!=null&&b!=null){
       const home=(r+k)%2===0; games.push({home:home? a:b, away:home? b:a, played:false});
     }
   }
   rounds.push(games);
   arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
 }
 const second=rounds.map(gs=>gs.map(g=>({home:g.away,away:g.home,played:false})));
 career.leagueSchedule=rounds.concat(second);
 career.fixtures=[];
 career.leagueSchedule.forEach((games,round)=>games.forEach(g=>{
   if(g.home===career.club||g.away===career.club){
     career.fixtures.push({op:g.home===career.club?g.away:g.home,home:g.home===career.club,played:false,round});
   }
 }));
}

function getTransferAsking(i){

 if(!Number.isFinite(Number(career.transferAsking[i]))){
   const x=PLAYER_POOL[i]; if(!x)return 0;
   const base=Number(x[3])||1, ov=Number(x[2])||70;
   const age=career.players.find(p=>p.name===x[0])?.age??(18+Math.floor(Math.random()*10));
   const eliteClub=["Real Madrid","Barcelona","Bayern Munich","Paris Saint-Germain","Manchester City","Liverpool","Arsenal"].includes(x[4]);
   const clubFactor=eliteClub?1.28:1.10;
   const ageFactor=age<=23?1.18:age<=27?1.08:Math.max(.82,1-(age-27)*.035);
   const ovFactor=1+(ov-75)*.014;
   const marketPremium=.96+Math.random()*.22;
   career.transferAsking[i]=Math.max(base+1,Math.ceil(base*clubFactor*ageFactor*ovFactor*marketPremium));
   save();
 }
 return Number(career.transferAsking[i]);
}

function easierUCLDraw(){
 const available=EURO_CLUBS.map((_,i)=>i);
 const rating=i=>{const c=EURO_CLUBS[i];return (c.atk+c.mid+c.def)/3};
 const userRating=strengthForClub(career.club);
 const picks=[];
 for(let round=0;round<8;round++){
   const candidates=available.filter(i=>!picks.includes(i));
   const weighted=candidates.map(i=>{
     const r=rating(i);
     const easier=Math.max(0,userRating-r);
     // Very strong bias toward the lower-rated half, so the league phase is
     // substantially easier while still allowing a couple of tougher tests.
     let w=(r<=80?24:1)+easier*1.2;
     if(round<6 && r<=80)w+=16;
     return {i,w};
   });
   const total=weighted.reduce((sum,x)=>sum+x.w,0);
   let roll=Math.random()*total;
   let chosen=weighted[weighted.length-1].i;
   for(const x of weighted){roll-=x.w;if(roll<=0){chosen=x.i;break;}}
   picks.push(chosen);
 }
 return picks;
}
function strengthForClub(i){
 const c=CLUBS[i];
 return c?(c.atk+c.mid+c.def)/3:80;
}

function maybeQualify(){

   const pos=rows().findIndex(r=>r.i===career.club)+1;
   if(pos<=4 && !career.champions.qualified){
     career.champions.qualified=true;
     const pool=easierUCLDraw();
     career.champions.phase=pool.map((op,i)=>({op,home:i%2===0,played:false}));
     career.inbox.push(`Champions League secured — you finished ${pos}${pos===1?'st':pos===2?'nd':pos===3?'rd':'th'}!`);
   } else career.inbox.push(`Season complete — you finished ${pos}${pos===1?'st':pos===2?'nd':pos===3?'rd':'th'}.`);
   save();
 }
}
function simulateLeagueRound(round,skipFixture){
 const games=career.leagueSchedule?.[round]||[];
 games.forEach(g=>{
   if(g.played || g.home===career.club || g.away===career.club) return;
   const hs=simScoreFor(g.home,g.away), as=simScoreFor(g.away,g.home);
   applyTableResult(g.home,g.away,hs,as); g.played=true; g.score=`${hs}-${as}`;
 });
}
function simScoreFor(home,away){
 const diff=strength(home)-strength(away)+3;
 const xg=Math.max(.45,Math.min(2.7,1.25*Math.exp(diff/34)));
 return Math.min(6,poisson(xg));
}
function applyTableResult(home,away,hs,as){
 const h=career.table[home],a=career.table[away]; h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
 if(hs>as){h.w++;h.pts+=3;a.l++;} else if(hs<as){a.w++;a.pts+=3;h.l++;} else {h.d++;a.d++;h.pts++;a.pts++;}
}

function finalizeUCLLeaguePhase(){
 const q=career.champions;
 if(!q.qualified||q.played<8||q.rank!==null)return;
 // Simulate the wider 36-club league table around the user's points total.
 // The game uses points first and goal difference as the tie-break, matching the
 // competition's table logic closely enough for career mode progression.
 const others=[];
 for(let i=0;i<35;i++){
   const pts=Math.max(3,Math.min(22,Math.round(11+(Math.random()-.5)*10)));
   const gd=Math.round((Math.random()-.5)*16);
   others.push({pts,gd});
 }
 others.push({pts:q.pts,gd:q.gf-q.ga,user:true});
 others.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
 q.rank=others.findIndex(x=>x.user)+1;
 const pool=EURO_CLUBS.map((_,i)=>i);
 if(q.rank<=8){
   const op=pool[Math.floor(Math.random()*pool.length)];
   q.knockout={stage:'Round of 16',leg:1,op,agg:0,done:false};
   q.phase.push({knockout:true,stage:'Round of 16',leg:1,op,home:true,played:false,score:null,result:null});
   career.inbox.push(`Champions League: ${q.rank}${q.rank===1?'st':q.rank===2?'nd':q.rank===3?'rd':'th'} — straight to the Round of 16.`);
 }else if(q.rank<=24){
   const op=pool[Math.floor(Math.random()*pool.length)];
   q.knockout={stage:'Knockout Play-off',leg:1,op,agg:0,done:false};
   q.phase.push({knockout:true,stage:'Knockout Play-off',leg:1,op,home:true,played:false,score:null,result:null});
   career.inbox.push(`Champions League: ${q.rank}th — you reached the knockout phase play-off. Win the two-leg tie to reach the Round of 16.`);
 }else{
   q.eliminated=true;
   q.knockout={stage:'Eliminated',leg:0,op:null,agg:0,done:true};
   career.inbox.push(`Champions League: ${q.rank}th — eliminated after the league phase. The knockout phase is no longer available this season.`);
 }
}
function simulateUCL(){
 const q=career.champions;if(!q.qualified||q.played>=q.phase.length||q.eliminated)return;
 const f=q.phase[q.played];
 if(f.knockout)return playUCLKnockout();
 const me=CLUBS[career.club],op=EURO_CLUBS[f.op],t=career.tactics||{};
 let diff=avg()*.72+me.atk*.11+me.mid*.09+me.def*.08-(op.atk+op.mid+op.def)/3+(f.home?2.5:-1.5);
 if(t.mentality==='Attacking')diff+=3;if(t.mentality==='Defensive')diff-=1;if(t.press==='High')diff+=2;
 const xg=Math.max(.45,Math.min(2.8,1.25*Math.exp(diff/35))),oxg=Math.max(.4,Math.min(2.5,1.1*Math.exp(-diff/37)));
 const a=Math.min(6,poisson(xg)),b=Math.min(6,poisson(oxg));
 f.played=true;f.score=`${a}-${b}`;f.result=a>b?'W':a<b?'L':'D';q.played++;q.gf+=a;q.ga+=b;
 if(a>b){q.wins++;q.pts+=3}else if(a<b){q.losses++}else{q.draws++;q.pts++}
 career.inbox.push(`Champions League: ${f.result} ${a}-${b} vs ${op.name}.`);
 if(q.played===8)finalizeUCLLeaguePhase();
 save();render();
}

function makeResult(f,hs,as,simulated){
 f.played=true;f.score=`${hs}-${as}`;f.result=hs>as?"W":hs<as?"L":"D";

 if(hs>as){career.wins++;career.points+=3} else if(hs<as){career.losses++} else {career.draws++;career.points++}
 career.gf+=hs;career.ga+=as;career.matchday++;
 if(career.leagueSchedule?.[f.round]){
   const own=career.leagueSchedule[f.round].find(g=>(g.home===career.club&&g.away===f.op)||(g.away===career.club&&g.home===f.op));
   if(own){own.played=true;own.score=`${hs}-${as}`;}
   simulateLeagueRound(f.round,f);
 }
 career.inbox.push(`${simulated?"Simulated ":""}${f.result==="W"?"Win":f.result==="L"?"Loss":"Draw"} ${hs}-${as} vs ${CLUBS[f.op].name}.`);
 maybeQualify(); save();page="dashboard";render();
}

function poisson(lambda){
 let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<10);return Math.max(0,k-1)
}
function simulateNext(){
 const f=nextFixture();if(!f)return;
 const me=CLUBS[career.club],op=CLUBS[f.op];
 const my=(avg()*.78+me.atk*.10+me.mid*.07+me.def*.05);
 const opp=(op.atk+op.mid+op.def)/3;
 let diff=my-opp+(f.home?2.5:-2.5);
 const tt=career.tactics||{};
 if(tt.mentality==="Attacking")diff+=3;
 if(tt.mentality==="Defensive")diff-=1;
 if(tt.press==="High")diff+=2;
 let xg=Math.max(.55,Math.min(2.9,1.35*Math.exp(diff/34)));
 let oxg=Math.max(.45,Math.min(2.55,1.18*Math.exp(-diff/37)));
 let a=Math.min(6,poisson(xg)),b=Math.min(6,poisson(oxg));
 makeResult(f,a,b,true);
}

function playerPositionFit(pl,slot){
 const pos=String(pl?.pos||'').toUpperCase(),s=String(slot||'').toUpperCase();
 if(s==='GK')return pos==='GK'?100:0;
 if(s==='LB')return pos==='LB'?100:(pos==='CB'?72:0);
 if(s==='RB')return pos==='RB'?100:(pos==='CB'?72:0);
 if(s==='CB')return pos==='CB'?100:(['LB','RB','LWB','RWB'].includes(pos)?58:0);
 if(s==='LWB')return pos==='LWB'?100:(pos==='LB'?92:(pos==='LW'?55:(pos==='CB'?40:0)));
 if(s==='RWB')return pos==='RWB'?100:(pos==='RB'?92:(pos==='RW'?55:(pos==='CB'?40:0)));
 if(s==='DM')return pos==='DM'?100:(pos==='CM'?82:(pos==='AM'||pos==='CAM'?45:0));
 if(s==='CM')return pos==='CM'?100:(pos==='DM'?90:(pos==='AM'||pos==='CAM'?82:0));
 if(s==='LM')return pos==='LM'?100:(pos==='LW'?92:(pos==='CM'||pos==='AM'?65:0));
 if(s==='RM')return pos==='RM'?100:(pos==='RW'?92:(pos==='CM'||pos==='AM'?65:0));
 if(s==='LW')return pos==='LW'?100:(pos==='RW'?76:(pos==='AM'||pos==='CAM'?68:0));
 if(s==='RW')return pos==='RW'?100:(pos==='LW'?76:(pos==='AM'||pos==='CAM'?68:0));
 if(s==='AM'||s==='CAM')return (pos==='AM'||pos==='CAM')?100:(pos==='CM'?84:(pos==='LW'||pos==='RW'?58:0));
 if(s==='ST'||s==='FWD')return (pos==='FWD'||pos==='ST')?100:(pos==='LW'||pos==='RW'?66:(pos==='AM'||pos==='CAM'?60:0));
 return 0;
}
function playerPosMatches(pl,slot){return playerPositionFit(pl,slot)>0;}
function chooseBestForSlot(players,slot,used){
 const candidates=players.filter(p=>p&&!used.has(p.name)&&playerPositionFit(p,slot)>0);
 candidates.sort((a,b)=>playerPositionFit(b,slot)-playerPositionFit(a,slot)||b.ov-a.ov);
 return candidates[0]||null;
}
function buildStrictLineup(){
 const formation=formationSpots();
 const players=(career.players||[]).filter(p=>p&&p.name);
 const result=new Array(formation.length).fill(null);
 const used=new Set();
 const pick=(slot,preferredName=null)=>{
   const exactPreferred=preferredName?players.find(p=>p.name===preferredName&&!used.has(p.name)&&playerPositionFit(p,slot)>=95):null;
   if(exactPreferred){used.add(exactPreferred.name);return exactPreferred;}
   const candidates=players.filter(p=>!used.has(p.name)&&String(p.pos||'').toUpperCase()!=='GK'&&playerPositionFit(p,slot)>0);
   candidates.sort((a,b)=>playerPositionFit(b,slot)-playerPositionFit(a,slot)||b.ov-a.ov);
   const chosen=candidates[0]||null;
   if(chosen)used.add(chosen.name);
   return chosen;
 };
 const gks=players.filter(p=>String(p.pos||'').toUpperCase()==='GK'&&!used.has(p.name));
 const preferredGK=career.club===0?gks.find(p=>p.name==='David Raya'):null;
 const gk=preferredGK||gks.sort((a,b)=>b.ov-a.ov)[0]||null;
 result[0]=gk;if(gk)used.add(gk.name);
 const current=Array.isArray(career.tactics?.lineup)?career.tactics.lineup:[];
 // Assign every formation slot independently. This prevents players from shifting
 // into the wrong position when one slot has no exact match.
 for(let i=1;i<formation.length;i++){
   const slot=formation[i][2];
   result[i]=pick(slot,current[i]||null);
 }
 // Final fallback only fills an empty slot with a non-GK player; never move a GK
 // into an outfield position and never change the already assigned slot indices.
 for(let i=1;i<formation.length;i++){
   if(result[i])continue;
   const fallback=players.filter(p=>!used.has(p.name)&&String(p.pos||'').toUpperCase()!=='GK').sort((a,b)=>b.ov-a.ov)[0]||null;
   if(fallback){used.add(fallback.name);result[i]=fallback;}
 }
 return result;
}
function getStartingLineup(){

}
function ensureLineup(){
 if(!career)return;

 if(!Array.isArray(career.soldPlayers))career.soldPlayers=[];
 const sold=new Set(career.soldPlayers.map(n=>String(n).trim().toLowerCase()));
 career.players=(career.players||[]).filter(p=>p&&p.name&&!sold.has(String(p.name).trim().toLowerCase()));
 const lineup=buildStrictLineup();
 career.tactics.lineup=lineup.filter(Boolean).map(p=>p.name);
}
function autoSelectClosest(){
 if(!match||match.ended)return;
 const ball=match.ball;
 let best=-1,bestD=Infinity;
 for(let i=0;i<11;i++){const p=match.players[i],d=Math.hypot(p.x-ball.x,p.y-ball.y);if(d<bestD){bestD=d;best=i}}
 if(best>=0)match.control=best;
}
function substituteDuringMatch(outIndex,inName){
 if(!match||match.ended)return;
 const out=match.players[outIndex];
 if(!out||out.team!==0)return;
 const benchIndex=career.players.findIndex(p=>p.name===inName);
 if(benchIndex<0)return;
 const incoming=career.players[benchIndex];
 if(!match.bench?.includes(inName)){alert('That player is already on the pitch.');return;}
 const oldName=out.name;
 out.name=incoming.name;out.ov=incoming.ov;out.pos=incoming.pos;out.playerIndex=benchIndex;
 match.bench=match.bench.filter(n=>n!==inName);match.bench.push(oldName);
 if(career.tactics?.lineup){career.tactics.lineup[outIndex]=incoming.name;}
 match.log.unshift(`SUBSTITUTION — ${incoming.name} on for ${oldName}.`);
 if(match.control===outIndex)autoSelectClosest();
 save();destroy3DMatch();render();init3DMatch();
}

function startMatch(custom={}){
  const isFACup=!!custom.faCupMatch;
  const f=isFACup?custom.faCupMatch:nextFixture();if(!f)return;
  ensureLineup();
  const lineup=getStartingLineup();
  const spots=formationSpots();
  const gk=lineup.find(p=>String(p?.pos||'').toUpperCase()==='GK') || career.players.find(p=>String(p?.pos||'').toUpperCase()==='GK');
  if(!gk) throw new Error('START MATCH FAILED: no goalkeeper available');
  const ordered=[gk,...lineup.filter(p=>p!==gk)];
  const normalizeSlot=(slot)=>String(slot||'CM').toUpperCase();
  const userPos=spots.map(([depth,width])=>({x:width,y:100-depth}));
  const oppPos=spots.map(([depth,width])=>({x:width,y:depth}));

function repairCareerSquad(){
  if(!career) return;
  try{_fullSquadRepair()}catch(e){console.warn("Full squad repair skipped",e)}
  if(!Array.isArray(career.players)) career.players=[];
  if(!Array.isArray(career.soldPlayers)) career.soldPlayers=[];
  const sold=new Set(career.soldPlayers.map(n=>String(n).trim().toLowerCase()));
  const clean=[];
  const seen=new Set();
  for(const p of career.players){
    if(!p || typeof p!=="object" || !p.name) continue;
    const name=String(p.name).trim();
    const key=name.toLowerCase();
    if(sold.has(key) || seen.has(key)) continue;
    seen.add(key);
    clean.push({...p,name});
  }
  // Restore missing genuine players for older saves, but NEVER restore someone
  // recorded in soldPlayers. Transfers already in the squad are preserved.
  const clubName=CLUBS[career.club]?.name;
  const base=PLAYER_POOL.filter(x=>x[4]===clubName).map(x=>({name:x[0],pos:x[1],ov:x[2],value:x[3],morale:80,age:21}));
  const byName=new Map(clean.map(p=>[p.name.toLowerCase(),p]));
  const merged=[];
  for(const p of base){
    const key=p.name.toLowerCase();
    if(sold.has(key)) continue;
    if(byName.has(key)) merged.push(byName.get(key));
    else merged.push(p);
  }
  for(const p of clean){
    if(!base.some(x=>x.name.toLowerCase()===p.name.toLowerCase())) merged.push(p);
  }
  career.players=merged.filter(p=>!sold.has(String(p.name).trim().toLowerCase()));
  if(career.tactics&&Array.isArray(career.tactics.lineup)) career.tactics.lineup=career.tactics.lineup.filter(n=>!sold.has(String(n).trim().toLowerCase()));
  career._squadRepairVersion=7;
  save();
}

function sellPlayer(i){
 if(!career||!Array.isArray(career.players))return;
 const p=career.players[i];
 if(!p)return;
 const name=String(p.name).trim();
 if(!name)return;
 if(!Array.isArray(career.soldPlayers))career.soldPlayers=[];
 const soldKey=name.toLowerCase();
 if(career.soldPlayers.some(n=>String(n).trim().toLowerCase()===soldKey))return;
 const price=Math.max(1,Math.round((Number(p.value)||1)*(.82+Math.random()*.18)));
 // Sell immediately so the browser cannot get stuck behind a confirm dialog.
 career.cash+=price;
 career.soldPlayers.push(name);
 // Remove from every squad store before rebuilding the lineup.
 career.players=career.players.filter((player,idx)=>idx!==i && String(player?.name||'').trim().toLowerCase()!==soldKey);
 if(career.tactics&&Array.isArray(career.tactics.lineup)){
   career.tactics.lineup=career.tactics.lineup.filter(n=>String(n).trim().toLowerCase()!==soldKey);
 }
 if(match){
   if(Array.isArray(match.bench))match.bench=match.bench.filter(n=>String(n).trim().toLowerCase()!==soldKey);
   if(Array.isArray(match.players)){
     const mi=match.players.findIndex(x=>x.team===0&&String(x.name||'').trim().toLowerCase()===soldKey);
     if(mi>=0){
       match.players.splice(mi,1);
       if(match.control>=mi)match.control=Math.max(0,match.control-1);
     }
   }
 }
 career.inbox.unshift(`${name} sold for $${price}m and permanently left the club.`);
 ensureLineup();
 save();
 render();
}

function createFACup(){
  const pool=FA_CUP_TEAM_NAMES.slice().sort(()=>Math.random()-.5);
  const matches=[];
  for(let i=0;i<pool.length;i+=2){
    const home=Math.random()<.5;
    matches.push({home:home?pool[i]:pool[i+1],away:home?pool[i+1]:pool[i],played:false,score:null,winner:null,penalties:false});
  }
  return {round:"Round of 32",teams:pool,matches,playedIndex:0,eliminated:false,winner:null,champion:false,history:[]};
}
function faCupScore(home,away){
  const diff=faCupTeamRating(home)-faCupTeamRating(away)+3;
  const xg=Math.max(.35,Math.min(2.5,1.15*Math.exp(diff/35)));
  const oxg=Math.max(.3,Math.min(2.2,1.05*Math.exp(-diff/38)));
  return [Math.min(6,poisson(xg)),Math.min(6,poisson(oxg))];
}
function faCupNextRoundName(r){
  return ({"Round of 32":"Round of 16","Round of 16":"Quarter-final","Quarter-final":"Semi-final","Semi-final":"Final","Final":"Winner"})[r]||"Winner";
}
function advanceFACupRound(fc){
  const winners=fc.matches.map(m=>m.winner).filter(Boolean);
  fc.history.push({round:fc.round,matches:fc.matches.map(m=>({...m}))});
  const next=faCupNextRoundName(fc.round);
  if(next==="Winner"){
    fc.winner=winners[0]||null; fc.champion=fc.winner===CLUBS[career.club].name; fc.playedIndex=fc.matches.length; fc.round="Winner";
    career.inbox.unshift(`🏆 FA Cup Final: ${fc.winner||"Unknown"} are the champions!`);
    if(fc.champion) career.inbox.unshift("🏆 FA Cup WINNERS! Your club lifted the trophy at Wembley.");
    return;
  }
  fc.round=next;fc.teams=winners;fc.matches=[];fc.playedIndex=0;
  for(let i=0;i<winners.length;i+=2){
    const a=winners[i],b=winners[i+1]; if(!b)continue;
    const home=Math.random()<.5;fc.matches.push({home:home?a:b,away:home?b:a,played:false,score:null,winner:null,penalties:false});
  }
  career.inbox.unshift(`🏆 FA Cup draw: ${fc.round} is ready.`);
}
function resolveFACupTie(m){
  let [a,b]=faCupScore(m.home,m.away);
  if(a===b){m.penalties=true;m.winner=Math.random()<(faCupTeamRating(m.home)/(faCupTeamRating(m.home)+faCupTeamRating(m.away)))?m.home:m.away;}
  else m.winner=a>b?m.home:m.away;
  m.played=true;m.score=`${a}-${b}${a===b?` (pens ${m.winner===m.home?'H':'A'})`:''}`;
}
function getUserFACupMatch(){
  const fc=career.faCup; if(!fc||fc.eliminated||fc.round==="Winner")return null;
  const user=CLUBS[career.club].name;
  return fc.matches.find(m=>(m.home===user||m.away===user)&&!m.played)||null;
}
function resolveOtherFACupTies(fc,userMatch){
  if(!fc||!Array.isArray(fc.matches))return;
  fc.matches.filter(m=>!m.played&&m!==userMatch).forEach(resolveFACupTie);
  fc.playedIndex=fc.matches.length;
}
function finishFACupUserMatch(userMatch,hs,as,simulated){
  const fc=career.faCup; if(!fc||!userMatch||userMatch.played)return;
  const user=CLUBS[career.club].name;
  userMatch.played=true;
  userMatch.score=`${hs}-${as}`;
  let winner=hs>as?userMatch.home:hs<as?userMatch.away:null;
  if(!winner){
    const homeR=faCupTeamRating(userMatch.home),awayR=faCupTeamRating(userMatch.away);
    winner=Math.random()<(homeR/(homeR+awayR))?userMatch.home:userMatch.away;
    userMatch.penalties=true;
    userMatch.score+=` (pens ${winner===userMatch.home?'H':'A'})`;
  }
  userMatch.winner=winner;
  const usWon=winner===user;
  resolveOtherFACupTies(fc,userMatch);
  fc.eliminated=!usWon;
  career.inbox.unshift(`${simulated?'Simulated ':''}FA Cup ${fc.round}: ${userMatch.home} ${userMatch.score} ${userMatch.away} — ${usWon?'you advance':'you are eliminated'}.`);
  if(!fc.eliminated)advanceFACupRound(fc);
  save();page="facup";render();
}
function simulateFACupMatch(){
  const fc=career.faCup; if(!fc||fc.eliminated||fc.round==="Winner")return;
  const userMatch=getUserFACupMatch();
  if(!userMatch){
    fc.matches.filter(m=>!m.played).forEach(resolveFACupTie);
    fc.playedIndex=fc.matches.length;
    advanceFACupRound(fc); save(); render(); return;
  }
  fc.matches.filter(m=>!m.played && m!==userMatch).forEach(resolveFACupTie);
  const [hs,as]=faCupScore(userMatch.home,userMatch.away);
  finishFACupUserMatch(userMatch,hs,as,true);
}
function playFACupMatch(){
  const userMatch=getUserFACupMatch();
  if(!userMatch)return;
  resolveOtherFACupTies(career.faCup,userMatch);
  save();
  const user=CLUBS[career.club].name;
  const opponentName=userMatch.home===user?userMatch.away:userMatch.home;
  const isHome=userMatch.home===user;
  const fixture={faCup:true,homeName:userMatch.home,awayName:userMatch.away,isHomeUser:isHome,opponentName,faRef:userMatch};
  startMatch({faCupMatch:fixture});
}
function simulateFACupOnlyOtherTies(){
  const fc=career.faCup; if(!fc)return;
  fc.matches.filter(m=>!m.played && !((m.home===CLUBS[career.club].name)||(m.away===CLUBS[career.club].name))).forEach(resolveFACupTie);
  save();render();
}

  ${active&&!fc.eliminated?`<div class="notice"><b>Your FA Cup tie:</b> ${esc(active.home)} vs ${esc(active.away)} <span style="float:right;display:flex;gap:8px"><button data-fa-play>Play Match</button><button class="secondary" data-fa-sim>Simulate</button></span></div>`:''}
  <div class="table"><table><tr><th>Home</th><th>Score</th><th>Away</th><th>Status</th></tr>${rows||`<tr><td colspan="4">The FA Cup has finished for this season.</td></tr>`}</table></div></div>`);

function playUCLKnockout(){

 const op=EURO_CLUBS[f.op];
 const diff=avg()*.72+CLUBS[career.club].atk*.11+CLUBS[career.club].mid*.09+CLUBS[career.club].def*.08-(op.atk+op.mid+op.def)/3+(f.home?2:-2);
 const a=Math.min(5,poisson(Math.max(.35,1.25*Math.exp(diff/35)))); const b=Math.min(5,poisson(Math.max(.35,1.15*Math.exp(-diff/37))));
 f.played=true;f.score=`${a}-${b}`;f.result=a>b?'W':a<b?'L':'D';
 if(f.leg===1){q.knockout.agg=(f.home?a-b:b-a);q.phase.push({...f,leg:2,home:!f.home,played:false,score:null,result:null});q.played++;}
 else {

     if(f.stage==='Final'){q.knockout.done=true;q.played++;career.inbox.push('Champions League FINAL won — European champions!');}
     else {const next=stages[stages.indexOf(f.stage)+1];const pool=EURO_CLUBS.map((_,i)=>i).filter(i=>i!==f.op).sort(()=>Math.random()-.5);q.knockout={stage:next,leg:1,op:pool[0],agg:0,done:false};q.phase.push({knockout:true,stage:next,leg:1,op:pool[0],home:true,played:false,score:null,result:null});q.played++;}
   }else{q.knockout.done=true;q.knockout.eliminated=true;q.eliminated=true;q.played++;career.inbox.push(`Champions League: eliminated in the ${f.stage}.`);}
 }

 document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellPlayer(Number(b.dataset.sell)));
 document.querySelectorAll('[data-start-player]').forEach(b=>b.onclick=()=>{ensureLineup();const name=b.dataset.startPlayer;const idx=career.tactics.lineup.length-1;const replaced=career.tactics.lineup[idx];if(!career.tactics.lineup.includes(name)){career.tactics.lineup[idx]=name;career.inbox.unshift(`${name} added to the starting XI; ${replaced||'a player'} moved to the bench.`);}save();render();});
 if(page==='match'&&match){const out=document.getElementById('subOut'),inn=document.getElementById('subIn');if(out&&inn){out.innerHTML=match.players.slice(0,11).map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.name)} (${p.ov})</option>`).join('');inn.innerHTML=(match.bench||[]).map(n=>{const p=career.players.find(x=>x.name===n);return `<option value="${esc(n)}">${esc(n)} (${p?.ov||70})</option>`}).join('');document.querySelector('[data-substitute]')?.addEventListener('click',()=>substituteDuringMatch(Number(out.value),inn.value));}}

 document.querySelectorAll("[data-bid]").forEach(b=>{
    b.type='button';
    b.removeAttribute('disabled');
    b.onclick=(e)=>{
      e.preventDefault();
      e.stopImmediatePropagation();
      const idx=parseInt(b.dataset.bid,10);
      const input=document.querySelector(`[data-bid-offer="${idx}"]`);
      if(!Number.isNaN(idx)) bidForPlayer(idx,input ? input.value : '');
    };
  });
 const marketSearch=document.querySelector('[data-market-search]');
 const marketPos=document.querySelector('#marketPos');
 const applyMarketFilter=()=>{
   window.marketQuery=(marketSearch?.value||'').trim().toLowerCase();
   window.marketPos=marketPos?.value||'';
   document.querySelectorAll('.marketRow').forEach(row=>{
     const text=row.dataset.marketText||'';
     const okText=!window.marketQuery||text.includes(window.marketQuery);
     const okPos=!window.marketPos||row.dataset.marketPos===window.marketPos;
     row.style.display=(okText&&okPos)?'':'none';
   });
 };
 document.querySelector('[data-market-filter]')?.addEventListener('click',applyMarketFilter);
 marketSearch?.addEventListener('keydown',e=>{if(e.key==='Enter')applyMarketFilter();});
 document.querySelectorAll("[data-forfeit]").forEach(b=>b.onclick=forfeit);
 document.querySelectorAll("[data-tactic]").forEach(s=>{
   s.value=(career.tactics&&career.tactics[s.dataset.tactic])||s.value;
   s.onchange=()=>{career.tactics[s.dataset.tactic]=s.value;if(s.dataset.tactic==='formation')ensureLineup();save();render()};
 });
 document.querySelectorAll("[data-ucl-sim]").forEach(b=>b.onclick=simulateUCL);
 document.querySelectorAll("[data-ucl-continue]").forEach(b=>b.onclick=continueUCL);
 document.querySelectorAll("[data-ucl-ko]").forEach(b=>b.onclick=playUCLKnockout);
 document.querySelectorAll("[data-fa-play]").forEach(b=>b.onclick=playFACupMatch);
 document.querySelectorAll("[data-fa-sim]").forEach(b=>b.onclick=simulateFACupMatch);
 document.querySelectorAll("[data-drag-player]").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("text/plain",el.dataset.dragPlayer));
 const pitch=document.querySelector('.tacticalPitch');
 if(pitch){pitch.ondragover=e=>e.preventDefault();pitch.ondrop=e=>{e.preventDefault();const el=document.querySelector(`[data-drag-player="${e.dataTransfer.getData('text/plain')}"]`);if(!el)return;const r=pitch.getBoundingClientRect();el.style.left=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100))+'%';};}
}


function bootGame(){
  try{
    career=load();
    if(career && (!CLUBS[career.club] || !Array.isArray(career.players) || !Array.isArray(career.fixtures))){career=null;}
    if(career){
      if(!career.tactics || typeof career.tactics!=="object") career.tactics={formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium",lineup:[]};
      try{ensureLineup()}catch(e){career.tactics={formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium",lineup:[]};ensureLineup();}
      if(!career.faCup || !Array.isArray(career.faCup.matches) || career.faCup.round==='Third Round' || (career.faCup.round==='Round of 32' && career.faCup.matches.length!==16)) career.faCup=createFACup();
      const validSchedule=Array.isArray(career.leagueSchedule)&&career.leagueSchedule.length===38&&Array.isArray(career.fixtures)&&career.fixtures.length===38&&Array.isArray(career.table)&&career.table.length===20;
      if(!validSchedule){career.table=CLUBS.map(x=>({name:x.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));makeFixtures();}
      try{repairCareerSquad()}catch(e){console.warn("Squad repair skipped",e)}
      save();
    }
  }catch(e){console.error("Career boot error",e);career=null;page="home";}
  try{render()}catch(e){
    console.error("Render error",e);
    career=null;page="home";
    try{render()}catch(_){
      const root=document.getElementById("root");
      if(root)root.innerHTML='<main class="wrap"><section class="hero"><h1>Football Career Mode</h1><p class="muted">The game could not start this time. Refresh the page to try again.</p></section></main>';
    }
  }
}
bootGame();
</script>
</body>
</html>
