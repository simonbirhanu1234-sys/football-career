function makeFixtures(){
 const ids=DOMESTIC_CLUB_IDS.slice();
 let arr=ids.slice();
 if(arr.length%2) arr.push(null);
 const n=arr.length, rounds=[];
 for(let r=0;r<n-1;r++){
   const games=[];
   for(let k=0;k<n/2;k++){
     const a=arr[k],b=arr[n-1-k]; if(a!=null&&b!=null){
       const home=(r+k)%2===0; games.push({home:home? a:b, away:home? b:a, played:false});
     }
   }
   rounds.push(games);
   arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
 }
 const second=rounds.map(gs=>gs.map(g=>({home:g.away,away:g.home,played:false})));
 career.leagueSchedule=rounds.concat(second);
 career.fixtures=[];
 career.leagueSchedule.forEach((games,round)=>games.forEach(g=>{
   if(g.home===career.club||g.away===career.club){
     career.fixtures.push({op:g.home===career.club?g.away:g.home,home:g.home===career.club,played:false,round});
   }
 }));
 // For the 2026/27 Premier League season, use the official real-life schedule
 // for Arsenal instead of the generated round-robin order. Other clubs retain
 // the career-mode generated schedule unless their real schedule is added here.
 if(DOMESTIC_LEAGUE_NAME==='Premier League' && career.season===2026){
   const real=REAL_PL_SCHEDULES_2627[CLUBS[career.club]?.name];
   if(Array.isArray(real) && real.length===38){
     career.fixtures=real.map((x,round)=>{
       const op=CLUBS.findIndex(c=>c.name===x.op);
       return {op,home:x.home,played:false,round,date:x.date};
     });
   }
 }
}

function easierUCLDraw(){
 const available=UCL_CLUBS.map((_,i)=>i);
 const rating=i=>{const c=UCL_CLUBS[i];return (c.atk+c.mid+c.def)/3};
 const userRating=strengthForClub(career.club);
 const picks=[];
 for(let round=0;round<8;round++){
   const candidates=available.filter(i=>!picks.includes(i));
   const weighted=candidates.map(i=>{
     const r=rating(i);
     const easier=Math.max(0,userRating-r);
     // Very strong bias toward the lower-rated half, so the league phase is
     // substantially easier while still allowing a couple of tougher tests.
     let w=(r<=80?24:1)+easier*1.2;
     if(round<6 && r<=80)w+=16;
     return {i,w};
   });
   const total=weighted.reduce((sum,x)=>sum+x.w,0);
   let roll=Math.random()*total;
   let chosen=weighted[weighted.length-1].i;
   for(const x of weighted){roll-=x.w;if(roll<=0){chosen=x.i;break;}}
   picks.push(chosen);
 }
 return picks;
}
function strengthForClub(i){
 const c=CLUBS[i];
 return c?(c.atk+c.mid+c.def)/3:80;
}

function repairCareerSquad(){
  if(!career) return;
  try{_fullSquadRepair()}catch(e){console.warn("Full squad repair skipped",e)}
  if(!Array.isArray(career.players)) career.players=[];
  if(!Array.isArray(career.soldPlayers)) career.soldPlayers=[];
  const sold=new Set(career.soldPlayers.map(n=>String(n).trim().toLowerCase()));
  const clean=[];
  const seen=new Set();
  for(const p of career.players){
    if(!p || typeof p!=="object" || !p.name) continue;
    const name=String(p.name).trim();
    const key=name.toLowerCase();
    if(sold.has(key) || seen.has(key)) continue;
    seen.add(key);
    clean.push({...p,name});
  }
  // Restore missing genuine players for older saves, but NEVER restore someone
  // recorded in soldPlayers. Transfers already in the squad are preserved.
  const clubName=CLUBS[career.club]?.name;
  const base=PLAYER_POOL.filter(x=>x[4]===clubName).map(x=>({name:x[0],pos:x[1],ov:x[2],value:x[3],morale:80,age:playerAgeFromDob(x[5],career?.season||2026)??stableAgeEstimate(x[0],x[2],x[1],x[4])}));
  const byName=new Map(clean.map(p=>[p.name.toLowerCase(),p]));
  const merged=[];
  for(const p of base){
    const key=p.name.toLowerCase();
    if(sold.has(key)) continue;
    if(byName.has(key)) merged.push(byName.get(key));
    else merged.push(p);
  }
  for(const p of clean){
    if(!base.some(x=>x.name.toLowerCase()===p.name.toLowerCase())) merged.push(p);
  }
  career.players=merged.filter(p=>!sold.has(String(p.name).trim().toLowerCase()));
  if(career.tactics&&Array.isArray(career.tactics.lineup)) career.tactics.lineup=career.tactics.lineup.filter(n=>!sold.has(String(n).trim().toLowerCase()));
  career._squadRepairVersion=10;
  save();
}

function startBenchPlayer(name){
 if(!career||!career.tactics)return;
 normalizePlayerData();
 const incomingKey=playerIdentity(name);
 const incoming=(career.players||[]).find(p=>playerIdentity(p.name)===incomingKey);
 if(!incoming)return;
 ensureLineup();
 const lineup=(career.tactics.lineup||[]).map(officialPlayerName);
 const unique=[];
 const seen=new Set();
 for(const n of lineup){const key=playerIdentity(n);if(!seen.has(key)){seen.add(key);unique.push(officialPlayerName(n));}}
 if(unique.some(n=>playerIdentity(n)===incomingKey))return;
 if(unique.length!==11){ensureLineup();return;}
 let replaceIndex=-1;
 const pos=String(incoming.pos||'').toUpperCase();
 for(let i=1;i<unique.length;i++){
  const p=(career.players||[]).find(x=>playerIdentity(x.name)===playerIdentity(unique[i]));
  const pp=String(p?.pos||'').toUpperCase();
  if((pos==='ST'||pos==='FWD')&&['ST','FWD','LW','RW','AM','CAM'].includes(pp)){replaceIndex=i;break;}
  if((pos==='LW'||pos==='RW')&&['LW','RW','AM','CAM'].includes(pp)){replaceIndex=i;break;}
  if(['CM','DM','AM','CAM'].includes(pos)&&['CM','DM','AM','CAM'].includes(pp)){replaceIndex=i;break;}
  if(['CB','LB','RB','LWB','RWB'].includes(pos)&&['CB','LB','RB','LWB','RWB'].includes(pp)){replaceIndex=i;break;}
 }
 if(replaceIndex<0)replaceIndex=1;
 const replaced=unique[replaceIndex];
 unique[replaceIndex]=officialPlayerName(incoming.name);
 career.tactics.lineup=unique;
 career.tactics.lineupLocked=true;
 career.inbox.unshift(incoming.name+' added to the starting XI'+(replaced?'; '+replaced+' moved to the bench.':'.'));
 save();
 render();
}

function sellPlayer(i){
 if(!transferWindowOpen()){alert("Player sales are only allowed in January, May, June, July, and August.");return;}
 if(!career||!Array.isArray(career.players))return;
 const p=career.players[i];
 if(!p)return;
 const name=String(p.name).trim();
 if(!name)return;
 if(!Array.isArray(career.soldPlayers))career.soldPlayers=[];
 const soldKey=name.toLowerCase();
 if(career.soldPlayers.some(n=>String(n).trim().toLowerCase()===soldKey))return;
 const price=Math.max(1,Math.round((Number(p.value)||1)*(.82+Math.random()*.18)));
 // Sell immediately so the browser cannot get stuck behind a confirm dialog.
 career.cash+=price;
 career.soldPlayers.push(name);
 // Remove from every squad store before rebuilding the lineup.
 career.players=career.players.filter((player,idx)=>idx!==i && String(player?.name||'').trim().toLowerCase()!==soldKey);
 if(career.tactics&&Array.isArray(career.tactics.lineup)){
   career.tactics.lineup=career.tactics.lineup.filter(n=>String(n).trim().toLowerCase()!==soldKey);
 }
 if(match){
   if(Array.isArray(match.bench))match.bench=match.bench.filter(n=>String(n).trim().toLowerCase()!==soldKey);
   if(Array.isArray(match.players)){
     const mi=match.players.findIndex(x=>x.team===0&&String(x.name||'').trim().toLowerCase()===soldKey);
     if(mi>=0){
       match.players.splice(mi,1);
       if(match.control>=mi)match.control=Math.max(0,match.control-1);
     }
   }
 }
 career.inbox.unshift(`${name} sold for $${price}m and permanently left the club.`);
 ensureLineup();
 save();
 render();
}

function faCupScore(home,away){
  // More realistic cup simulation: attack vs defence, midfield control, home advantage,
  // a little form/variance, and strong limits on extreme scorelines.
  const h=faCupProfile(home), a=faCupProfile(away);
  const baseHome=1.28, baseAway=1.02;
  const homeAdv=2.7;
  const qualityGap=(h.overall-a.overall);
  const midfieldGap=(h.mid-a.mid)*0.22;
  const hForm=(Math.random()-.5)*3.0, aForm=(Math.random()-.5)*3.0;
  const matchEdge=qualityGap*0.48+midfieldGap+homeAdv+hForm-aForm;
  const hAttack=(h.atk-a.def)*0.016;
  const aAttack=(a.atk-h.def)*0.015;
  let homeXg=baseHome+hAttack+matchEdge*0.020;
  let awayXg=baseAway+aAttack-matchEdge*0.017;
  homeXg=Math.max(0.38,Math.min(2.75,homeXg));
  awayXg=Math.max(0.30,Math.min(2.35,awayXg));

  let hs=Math.min(6,poisson(homeXg));
  let as=Math.min(6,poisson(awayXg));

  // Keep the most common football scorelines common and arcade-style blowouts rare.
  if(Math.abs(hs-as)>=4 && Math.random()<0.90){
    if(hs>as) hs=Math.min(5,as+3); else as=Math.min(5,hs+3);
  }
  if(hs===5 && as===0 && Math.random()<0.65) hs=4;
  if(as===5 && hs===0 && Math.random()<0.65) as=4;
  return [hs,as];
}

 const rows=clubs.map((c,i)=>{const base=clubStrengthName(c);return {name:c.name,pts:Math.max(0,Math.round(base/8)+((i*7)%7)),gd:Math.round((base-70)/4),wins:Math.max(1,Math.min(7,Math.round(base/25))),draws:2,losses:6-Math.max(1,Math.min(7,Math.round(base/25)))}});
 const userName=CLUBS[career.club].name;
 let ur=rows.find(r=>r.name===userName); if(!ur){ur={name:userName,pts:q.pts,gd:q.gf-q.ga,wins:q.wins,draws:q.draws,losses:q.losses};rows.push(ur);} else {ur.pts=q.pts;ur.gd=q.gf-q.ga;ur.wins=q.wins;ur.draws=q.draws;ur.losses=q.losses;}
 rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.name.localeCompare(b.name));
 const rank=q.rank||rows.findIndex(r=>r.name===userName)+1;
 const stages=['Round of 16','Quarter-final','Semi-final','Final'];
 const bracket=stages.map(stage=>{let opp='—',state='Scheduled';const f=(q.phase||[]).find(x=>x.stage===stage);if(ko&&ko.stage===stage){opp=UCL_CLUBS[ko.op]?.name||'Opponent';state=ko.done?(ko.eliminated?'Eliminated':'Completed'):`Leg ${ko.leg||1}`;}else if(f){opp=UCL_CLUBS[f.op]?.name||'Opponent';state=f.played?(f.result||'Completed'):`Leg ${f.leg||1}`;}return `<div class="bracketStage"><div class="muted">${stage}</div><div class="bracketTie"><b>${esc(userName)}</b><span>vs</span><b>${esc(opp)}</b><small>${esc(state)}</small></div></div>`}).join('');
 return layout(`<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>🏆 UEFA Champions League</h2><p class="muted">League standings and knockout bracket. All match actions are available only from Schedule.</p></div><span class="pill">${status}</span></div><div class="stats"><div class="stat"><span class="muted">Points</span><b>${q.pts}</b></div><div class="stat"><span class="muted">League position</span><b>${q.rank??rank}</b></div><div class="stat"><span class="muted">Record</span><b>${q.wins}-${q.draws}-${q.losses}</b></div><div class="stat"><span class="muted">GD</span><b>${q.gf-q.ga>=0?'+':''}${q.gf-q.ga}</b></div></div><div class="two" style="margin-top:16px"><div class="card"><h3>League standings</h3><div class="table"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${rows.map((r,i)=>`<tr class="${r.name===userName?'you':''}"><td>${i+1}</td><td>${esc(r.name)}</td><td>8</td><td>${r.name===userName?q.wins:r.wins}</td><td>${r.name===userName?q.draws:r.draws}</td><td>${r.name===userName?q.losses:r.losses}</td><td>${r.name===userName?(q.gf-q.ga):r.gd}</td><td><b>${r.name===userName?q.pts:r.pts}</b></td></tr>`).join('')}</table></div></div><div class="card"><h3>Knockout bracket</h3><div class="uclBracket">${bracket}</div><div class="notice" style="margin-top:12px">Open <b>Schedule</b> to play or simulate Champions League matches.</div></div></div></div>`);
}
function continueUCL(){
 const q=career.champions;if(!q||!q.qualified||q.played!==8||q.rank!==null)return;
 finalizeUCLLeaguePhase();save();render();
}
function playUCLKnockout(){
 const q=career.champions, f=q.phase[q.played]; if(!f||!f.knockout||q.eliminated)return;
 const op=UCL_CLUBS[f.op];
 const diff=avg()*.72+CLUBS[career.club].atk*.11+CLUBS[career.club].mid*.09+CLUBS[career.club].def*.08-(op.atk+op.mid+op.def)/3+(f.home?2:-2);
 const a=Math.min(5,poisson(Math.max(.35,1.25*Math.exp(diff/35)))); const b=Math.min(5,poisson(Math.max(.35,1.15*Math.exp(-diff/37))));
 f.played=true;f.score=`${a}-${b}`;f.result=a>b?'W':a<b?'L':'D';
 if(f.leg===1){q.knockout.agg=(f.home?a-b:b-a);q.phase.push({...f,leg:2,home:!f.home,played:false,score:null,result:null});q.played++;}
 else {
   let total=q.knockout.agg+(f.home?b-a:a-b);
   if(total===0){
     const pens=Math.random()<0.5?1:-1;
     total=pens;
     career.inbox.push(`Champions League: aggregate draw — penalties decide the tie ${pens>0?'in your favour.':'against you.'}`);
   }
   const stages=['Round of 16','Quarter-final','Semi-final','Final'];
   if(total>0){
     if(f.stage==='Final'){q.knockout.done=true;q.played++;career.inbox.push('Champions League FINAL won — European champions!');}
     else {const next=stages[stages.indexOf(f.stage)+1];const pool=UCL_CLUBS.map((_,i)=>i).filter(i=>i!==f.op).sort(()=>Math.random()-.5);q.knockout={stage:next,leg:1,op:pool[0],agg:0,done:false};q.phase.push({knockout:true,stage:next,leg:1,op:pool[0],home:true,played:false,score:null,result:null});q.played++;}
   }else{q.knockout.done=true;q.knockout.eliminated=true;q.eliminated=true;q.played++;career.inbox.push(`Champions League: eliminated in the ${f.stage}.`);}
 }
 save();render();
}

function render(){
 const root=document.getElementById("root");
 root.innerHTML=career
  ? (page==="dashboard"?dashboard()
   :page==="squad"?squad()
   :page==="schedule"?schedule()
   :page==="fixtures"?fixtures()
   :page==="table"?table()
   :page==="transfers"?transfers()
   :page==="tactics"?tactics()
   :page==="champions"?champions()
   :page==="facup"?facup()
   :page==="match"?matchView()
   :dashboard())
  :home();
 bind();
 if(page==="match")bindMatchControls();
}
function bind(){
 document.querySelectorAll("[data-league]").forEach(b=>{
   b.type='button';
   b.onclick=e=>{e.preventDefault();window.selectedLeague=b.dataset.league;activateLeague(window.selectedLeague);render()};
 });
 /* Start Career uses a direct button handler in home() so it cannot be blocked by the generic binder. */
 document.querySelectorAll("[data-go]").forEach(b=>{
   b.type='button';
   b.onclick=e=>{e.preventDefault();const next=b.dataset.go;if(next){page=next;window.scheduleModalEvent=null;render();}};
 });
 document.querySelectorAll("[data-new]").forEach(b=>b.onclick=newCareer);
 document.querySelectorAll("[data-next-season]").forEach(b=>b.onclick=nextSeason);
 document.querySelectorAll('[data-schedule-prev]').forEach(b=>b.onclick=()=>{const d=new Date(`${window.scheduleMonth}-01T12:00:00Z`);d.setUTCMonth(d.getUTCMonth()-1);window.scheduleMonth=monthKey(d);render();});
 document.querySelectorAll('[data-schedule-next]').forEach(b=>b.onclick=()=>{const d=new Date(`${window.scheduleMonth}-01T12:00:00Z`);d.setUTCMonth(d.getUTCMonth()+1);window.scheduleMonth=monthKey(d);render();});
 document.querySelectorAll('[data-schedule-comp]').forEach(s=>s.onchange=()=>{window.scheduleComp=s.value;render();});
 document.querySelectorAll('[data-schedule-open]').forEach(el=>{el.onclick=()=>openScheduleGame(el.dataset.scheduleOpen);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openScheduleGame(el.dataset.scheduleOpen);}}});
 document.querySelectorAll('[data-schedule-close]').forEach(b=>b.onclick=()=>{window.scheduleModalEvent=null;render();});
 document.querySelectorAll('[data-schedule-play]').forEach(b=>b.onclick=()=>{const e=window.scheduleModalEvent;window.scheduleModalEvent=null;scheduleEventPlay(e);});
 document.querySelectorAll('[data-schedule-sim]').forEach(b=>b.onclick=()=>{const e=window.scheduleModalEvent;window.scheduleModalEvent=null;scheduleEventSim(e);});
 document.querySelectorAll("[data-trainall]").forEach(b=>b.onclick=trainAll);
 document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>trainPlayer(Number(b.dataset.train)));
 document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellPlayer(Number(b.dataset.sell)));
 document.querySelectorAll('[data-start-player]').forEach(b=>{
   b.type='button';
   b.onclick=(e)=>{
     e.preventDefault();
     e.stopPropagation();
     startBenchPlayer(b.dataset.startPlayer);
   };
 });
 if(page==='match'&&match){const out=document.getElementById('subOut'),inn=document.getElementById('subIn');if(out&&inn){out.innerHTML=match.players.slice(0,11).map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.name)} (${p.ov})</option>`).join('');inn.innerHTML=(match.bench||[]).map(n=>{const p=career.players.find(x=>x.name===n);return `<option value="${esc(n)}">${esc(n)} (${p?.ov||70})</option>`}).join('');document.querySelector('[data-substitute]')?.addEventListener('click',()=>substituteDuringMatch(Number(out.value),inn.value));}}

 document.querySelectorAll("[data-bid]").forEach(b=>{
    b.type='button';
    b.removeAttribute('disabled');
    b.onclick=(e)=>{
      e.preventDefault();
      e.stopImmediatePropagation();
      const idx=parseInt(b.dataset.bid,10);
      const input=document.querySelector(`[data-bid-offer="${idx}"]`);
      if(!Number.isNaN(idx)) bidForPlayer(idx,input ? input.value : '');
    };
  });
 const marketSearch=document.querySelector('[data-market-search]');
 const marketPos=document.querySelector('#marketPos');
 const applyMarketFilter=()=>{
   window.marketQuery=(marketSearch?.value||'').trim().toLowerCase();
   window.marketPos=marketPos?.value||'';
   document.querySelectorAll('.marketRow').forEach(row=>{
     const text=row.dataset.marketText||'';
     const okText=!window.marketQuery||text.includes(normalizeMarketText(window.marketQuery));
     const okPos=!window.marketPos||row.dataset.marketPos===window.marketPos;
     row.style.display=(okText&&okPos)?'':'none';
   });
 };
 document.querySelector('[data-market-filter]')?.addEventListener('click',applyMarketFilter);
 marketSearch?.addEventListener('keydown',e=>{if(e.key==='Enter')applyMarketFilter();});
 document.querySelectorAll("[data-forfeit]").forEach(b=>b.onclick=forfeit);
 document.querySelectorAll("[data-tactic]").forEach(s=>{
   s.value=(career.tactics&&career.tactics[s.dataset.tactic])||s.value;
   s.onchange=()=>{career.tactics[s.dataset.tactic]=s.value;if(s.dataset.tactic==='formation')ensureLineup();save();render()};
 });
 document.querySelectorAll("[data-ucl-continue]").forEach(b=>b.onclick=continueUCL);
 document.querySelectorAll("[data-drag-player]").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("text/plain",el.dataset.dragPlayer));
 const pitch=document.querySelector('.tacticalPitch');
 if(pitch){pitch.ondragover=e=>e.preventDefault();pitch.ondrop=e=>{e.preventDefault();const el=document.querySelector(`[data-drag-player="${e.dataTransfer.getData('text/plain')}"]`);if(!el)return;const r=pitch.getBoundingClientRect();el.style.left=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100))+'%';};}
}



document.addEventListener('click',function(e){
 const b=e.target.closest && e.target.closest('button[data-go="champions"]');
 if(!b || !career) return;
 e.preventDefault();
 e.stopPropagation();
 page='champions';
 render();
},true);

window.__startCareer=function(i){
  const idx=Number(i);
  try{
    activateLeague(window.selectedLeague||"Premier League");
    if(!Number.isInteger(idx)||idx<0||idx>=CLUBS.length) throw new Error("Invalid club index");
    startCareer(idx);
  }catch(err){
    console.error("Start Career failed",err);
    const el=document.getElementById("startError");
    if(el){el.textContent="Start Career failed: "+(err&&err.message?err.message:"unknown error");el.style.display="block";}
  }
};

function startCareerFromHash(){
  try{
    const m=String(location.hash||"").match(/^#start-career-(\d+)$/);
    if(!m || career) return false;
    window.__startCareer(Number(m[1]));
    return true;
  }catch(err){
    console.error("Hash Start Career failed",err);
    return false;
  }
}

window.addEventListener("hashchange",function(){
  const h=String(location.hash||"");
  if(h==="#league-premier"){ history.replaceState(null,"",location.pathname+location.search); window.selectedLeague="Premier League"; render(); return; }
  if(h==="#league-laliga"){ history.replaceState(null,"",location.pathname+location.search); window.selectedLeague="LaLiga"; render(); return; }
  startCareerFromHash();
});

function bootGame(){
  try{
    career=load();
    /* Preview-safe first launch: never require the Preview environment to execute
       the club-selection click just to enter Career Mode. A first-time Preview
       session starts with Arsenal; New Career still returns to the selector. */
    if(!career && !String(location.hash||'').match(/^#start-career-\d+$/)){
      window.selectedLeague='Premier League';
      activateLeague('Premier League');
      startCareer(0);
      return;
    }
    if(career){ activateLeague(career.league||"Premier League"); window.selectedLeague=DOMESTIC_LEAGUE_NAME; }
    if(career && (!CLUBS[career.club] || !Array.isArray(career.players) || !Array.isArray(career.fixtures))){career=null;}
    if(career){
      try{normalizePlayerData()}catch(e){console.warn('Player identity normalization skipped',e)}
      if(career.tactics || typeof career.tactics!=="object") career.tactics={formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium",lineup:[]};
      try{ensureLineup()}catch(e){career.tactics={formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium",lineup:[]};ensureLineup();}
      if(currentLeague()==='LaLiga'){
        career.faCup=null;
        if(!career.copaDelRey || !Array.isArray(career.copaDelRey.matches) || (career.copaDelRey.round==='Round of 32' && career.copaDelRey.matches.length!==16)) career.copaDelRey=createCopaDelRey();
      }else{
        career.copaDelRey=null;
        if(!career.faCup || !Array.isArray(career.faCup.matches) || career.faCup.round==='Third Round' || (career.faCup.round==='Round of 32' && career.faCup.matches.length!==16)) career.faCup=createFACup();
      }
      const validSchedule=Array.isArray(career.leagueSchedule)&&career.leagueSchedule.length===38&&Array.isArray(career.fixtures)&&career.fixtures.length===38&&Array.isArray(career.table)&&career.table.length===20;
      if(!validSchedule){career.table=CLUBS.map(x=>({name:x.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));makeFixtures();}
      try{ensureScheduleDates()}catch(e){console.warn("Schedule date repair skipped",e)}
      try{repairCareerSquad()}catch(e){console.warn("Squad repair skipped",e)}
      try{normalizeCareerAges()}catch(e){console.warn("Age normalization skipped",e)}
      save();
    }
  }catch(e){console.error("Career boot error",e);career=null;page="home";}
  try{render()}catch(e){
    console.error("Render error",e);
    career=null;page="home";
    try{render()}catch(_){
      const root=document.getElementById("root");
      if(root)root.innerHTML='<main class="wrap"><section class="hero"><h1>Football Career Mode</h1><p class="muted">The game could not start this time. Refresh the page to try again.</p></section></main>';
    }
  }
}
bootGame();
startCareerFromHash();

</script>
