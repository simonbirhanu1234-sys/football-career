const PLAYER_POOL=[
["Robert Sanchez","GK",75,20,"Chelsea"],["Filip Jorgensen","GK",74,16,"Chelsea"],["David Raya","GK",86,45,"Arsenal"],["Kepa Arrizabalaga","GK",82,20,"Arsenal"],["Illan Meslier","GK",78,12,"Arsenal"],
["William Saliba","CB",90,105,"Arsenal"],["Cristhian Mosquera","CB",80,32,"Arsenal"],["Ben White","RB",86,52,"Arsenal"],["Piero Hincapie","CB",84,50,"Arsenal"],["Gabriel","CB",89,72,"Arsenal"],["Jurrien Timber","RB",85,55,"Arsenal"],["Ezri Konsa","CB",84,42,"Arsenal"],["Riccardo Calafiori","LB",82,45,"Arsenal"],
["Martin Odegaard","AM",89,95,"Arsenal"],["Eberechi Eze","AM",86,75,"Arsenal"],["Noni Madueke","RW",83,55,"Arsenal"],["Mikel Merino","CM",84,42,"Arsenal"],["Kai Havertz","FWD",87,85,"Arsenal"],["Martin Zubimendi","DM",85,65,"Arsenal"],["Bruno Guimaraes","CM",88,95,"Arsenal"],["Declan Rice","DM",88,100,"Arsenal"],
["Bukayo Saka","RW",90,130,"Arsenal"],["Viktor Gyokeres","FWD",88,95,"Arsenal"],["Christos Tzolis","LW",79,28,"Arsenal"],
["Alisson","GK",89,42,"Liverpool"],["Virgil van Dijk","CB",89,35,"Liverpool"],["Ibrahima Konate","CB",86,55,"Liverpool"],
["Alexis Mac Allister","CM",86,80,"Liverpool"],["Dominik Szoboszlai","AM",84,70,"Liverpool"],["Mohamed Salah","RW",90,80,"Liverpool"],["Luis Diaz","LW",87,85,"Liverpool"],["Darwin Nunez","FWD",84,70,"Liverpool"],["Florian Wirtz","AM",89,130,"Liverpool"],
["Ruben Dias","CB",89,90,"Manchester City"],["Josko Gvardiol","CB",87,85,"Manchester City"],["Rodri","DM",90,120,"Manchester City"],["Kevin De Bruyne","CM",88,35,"Manchester City"],["Phil Foden","AM",88,115,"Manchester City"],["Erling Haaland","FWD",91,180,"Manchester City"],["Bernardo Silva","CM",87,65,"Manchester City"],["Rayan Cherki","AM",83,55,"Manchester City"],["Enzo Fernandez","CM",88,125,"Manchester City"],
["Bruno Fernandes","AM",88,90,"Manchester United"],["Lisandro Martinez","CB",86,45,"Manchester United"],["Mason Mount","AM",80,28,"Manchester United"],
["James Maddison","AM",84,45,"Tottenham Hotspur"],["Son Heung-min","LW",87,30,"Tottenham Hotspur"],
["Lamine Yamal","RW",91,170,"Barcelona"],["Raphinha","RW",89,90,"Barcelona"],["Pedri","CM",91,130,"Barcelona"],["Gavi","CM",86,85,"Barcelona"],["Robert Lewandowski","FWD",88,28,"Barcelona"],["Jules Kounde","CB",87,55,"Barcelona"],["Ronald Araujo","CB",88,80,"Barcelona"],
["Thibaut Courtois","GK",88,45,"Real Madrid"],["Antonio Rudiger","CB",87,28,"Real Madrid"],["Jude Bellingham","CM",93,180,"Real Madrid"],["Federico Valverde","CM",89,110,"Real Madrid"],["Vinicius Jr","LW",93,190,"Real Madrid"],["Kylian Mbappe","FWD",94,220,"Real Madrid"],["Rodrygo","RW",88,100,"Real Madrid"],
["Harry Kane","FWD",91,90,"Bayern Munich"],["Michael Olise","RW",87,95,"Bayern Munich"],["Jamal Musiala","AM",91,150,"Bayern Munich"],["Joshua Kimmich","DM",88,75,"Bayern Munich"],["Alphonso Davies","LB",86,60,"Bayern Munich"],["Dayot Upamecano","CB",85,52,"Bayern Munich"],
["Ousmane Dembele","RW",90,100,"Paris Saint-Germain"],["Khvicha Kvaratskhelia","LW",88,95,"Paris Saint-Germain"],["Achraf Hakimi","RB",88,70,"Paris Saint-Germain"],["Victor Osimhen","FWD",88,100,"Paris Saint-Germain"],
["Lautaro Martinez","FWD",89,115,"Inter Milan"],["Nicolo Barella","CM",87,80,"Inter Milan"],["Marcus Thuram","FWD",85,55,"Inter Milan"],
["Theo Hernandez","LB",87,60,"AC Milan"],["Rafael Leao","LW",88,110,"AC Milan"],["Christian Pulisic","LW",84,55,"AC Milan"],["Mike Maignan","GK",87,45,"AC Milan"],
["Kenan Yildiz","LW",82,60,"Juventus"],["Dusan Vlahovic","FWD",84,55,"Juventus"],["Jadon Sancho","LW",81,30,"Free Agent"],["Raheem Sterling","RW",79,18,"Free Agent"]
];

let career=null, page="home", match=null, keys={};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem("fc_new_career_v49",JSON.stringify(career))}catch(e){}}
function load(){try{const fresh=localStorage.getItem("fc_new_career_v49"); if(fresh) return JSON.parse(fresh); return null}catch(e){return null}}
function avg(){return career.players.length?Math.round(career.players.reduce((a,p)=>a+p.ov,0)/career.players.length):0}
function strength(i){
 const c=CLUBS[i]; return Math.round((c.atk+c.mid+c.def)/3)
}
function startingSquad(clubName){
 const preferred=PLAYER_POOL.filter(x=>x[4]===clubName);
 const seen=new Set();
 return preferred.filter(x=>{
   const key=String(x[0]).trim().toLowerCase();
   if(seen.has(key)) return false;
   seen.add(key);
   return true;
 }).map(x=>({name:x[0],pos:x[1],ov:x[2],value:x[3],morale:80,age:20+Math.floor(Math.random()*10)}));
}
function playerOwner(name){
 const p=PLAYER_POOL.find(x=>x[0]===name); return p?p[4]:"European Club";
}
function startCareer(i){
 const c=CLUBS[i];
 career={
  club:i, season:2026, matchday:1, cash:c.budget,
  wins:0,draws:0,losses:0,gf:0,ga:0,points:0,
  players:startingSquad(c.name),
  fixtures:[], table:CLUBS.map(x=>({name:x.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),
  inbox:["Career started. Your board expects steady progress and sensible squad building."],
 tactics:{formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium",role0:"Balanced",role1:"Defend",role2:"Support",role3:"Balanced",role4:"Attack",role5:"Attack",role6:"Attack",mentality:"Balanced",press:"Medium"},
 champions:{qualified:false,phase:[],played:0,pts:0,wins:0,draws:0,losses:0,gf:0,ga:0},
  leagueSchedule:[]
 };
 makeFixtures();
 save();
 page="dashboard";
 render();
}
function makeFixtures(){
 const ids=DOMESTIC_CLUB_IDS.slice();
 let arr=ids.slice();
 if(arr.length%2) arr.push(null);
 const n=arr.length, rounds=[];
 for(let r=0;r<n-1;r++){
   const games=[];
   for(let k=0;k<n/2;k++){
     const a=arr[k],b=arr[n-1-k]; if(a!=null&&b!=null){
       const home=(r+k)%2===0; games.push({home:home? a:b, away:home? b:a, played:false});
     }
   }
   rounds.push(games);
   arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
 }
 const second=rounds.map(gs=>gs.map(g=>({home:g.away,away:g.home,played:false})));
 career.leagueSchedule=rounds.concat(second);
 career.fixtures=[];
 career.leagueSchedule.forEach((games,round)=>games.forEach(g=>{
   if(g.home===career.club||g.away===career.club){
     career.fixtures.push({op:g.home===career.club?g.away:g.home,home:g.home===career.club,played:false,round});
   }
 }));
}

function nextSeason(){
 if(!career?.seasonComplete)return;
 const pos=rows().findIndex(r=>r.i===career.club)+1;
 const prize=Math.max(8,(5-pos)*5);
 career.cash+=prize;
 career.season++;
 career.matchday=1;career.wins=0;career.draws=0;career.losses=0;career.gf=0;career.ga=0;career.points=0;
 career.table=CLUBS.map(x=>({name:x.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
 const earnedCL=!!career.champions?.qualified;
 career.seasonComplete=false;
 career.champions={qualified:earnedCL,phase:[],played:0,pts:0,wins:0,draws:0,losses:0,gf:0,ga:0};
 if(earnedCL){const pool=EURO_CLUBS.map((_,i)=>i).sort(()=>Math.random()-.5);career.champions.phase=pool.slice(0,8).map((op,i)=>({op,home:i%2===0,played:false}));}
 makeFixtures();
 career.inbox.push(`Season ${career.season} begins. Prize money: $${prize}m. Your squad carries over.`);
 save();page="dashboard";render();
}
function newCareer(){career=null;match=null;page="home";try{localStorage.removeItem("fc_new_career_v49")}catch(e){}render()}
function nextFixture(){return career.fixtures.find(f=>!f.played)}
function rows(){return DOMESTIC_CLUB_IDS.map(i=>({...career.table[i],i})).sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf)}
function nav(){return `<div class="nav">
<button data-go="dashboard" class="${page==="dashboard"?"active":""}">Dashboard</button>
<button data-go="squad" class="${page==="squad"?"active":""}">Squad</button>
<button data-go="fixtures" class="${page==="fixtures"?"active":""}">Fixtures</button>
<button data-go="table" class="${page==="table"?"active":""}">Premier League</button>
<button data-go="transfers" class="${page==="transfers"?"active":""}">Transfers</button>
<button data-go="tactics" class="${page==="tactics"?"active":""}">Tactics</button>
<button data-go="champions" class="${page==="champions"?"active":""}">Champions League</button>
${match?`<button data-go="match" class="${page==="match"?"active":""}">Match</button>`:""}
</div>`}
function layout(body){
 const c=CLUBS[career.club];
 return `<div class="top"><div class="topin"><b>⚽ FOOTBALL CAREER</b><div class="actions"><span class="pill">${c.badge} ${c.short}</span><span class="pill">💰 $${career.cash}m</span><button class="secondary" data-new>New Career</button></div></div></div>
 <main class="wrap">${nav()}${body}</main>`;
}
function home(){
 return `<main class="wrap"><section class="hero"><div style="font-size:54px">⚽</div><h1>Football Career Mode</h1><p class="muted">Start a brand-new career with real clubs. English clubs play in the Premier League; European clubs are kept for Champions League and transfers.</p></section>
 <div class="card"><h2>Choose your club</h2><div class="grid">${CLUBS.map((c,i)=>`<article class="card club"><div><div class="badge">${c.badge}</div><h3>${c.name}</h3><div class="muted">Strength ${strength(i)} · Budget $${c.budget}m</div></div><button data-start="${i}">Start Career</button></article>`).join("")}</div></div></main>`;
}
function dashboard(){
 const c=CLUBS[career.club], f=nextFixture(), op=f?CLUBS[f.op]:null;
 return layout(`<section class="card" style="margin-bottom:16px"><div class="actions" style="justify-content:space-between;align-items:center"><div><div class="muted">PREMIER LEAGUE · SEASON ${career.season} · MATCH ${Math.min(career.matchday,career.fixtures.length)}/${career.fixtures.length}</div><h1 style="margin:6px 0">${c.badge} ${c.name}</h1><div class="muted">Club strength ${strength(career.club)} · Squad OVR ${avg()}</div></div><div style="text-align:center"><div style="font-size:38px;font-weight:900">${career.points}</div><div class="muted">POINTS</div></div></div></section>
 <div class="stats"><div class="stat"><span class="muted">Record</span><b>${career.wins}-${career.draws}-${career.losses}</b></div><div class="stat"><span class="muted">Goals</span><b>${career.gf}-${career.ga}</b></div><div class="stat"><span class="muted">Squad OVR</span><b>${avg()}</b></div><div class="stat"><span class="muted">Budget</span><b>$${career.cash}m</b></div></div>
 <div class="two" style="margin-top:16px"><div class="card"><div class="muted">NEXT MATCH</div><h2>${op?`${f.home?"🏠":"✈️"} ${op.name}`:"Season complete"}</h2>${op?`<div class="actions"><button data-play>Play Match</button><button class="secondary" data-sim>Simulate Match</button></div>`:`<div class="actions"><button data-next-season>➡️ Next Season</button></div>`}</div>
 <div class="card"><h2>Manager Inbox</h2>${career.inbox.slice(-5).reverse().map(x=>`<div class="notice">${esc(x)}</div>`).join("")}</div></div>`);
}
function squad(){
 return layout(`<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Squad</h2><p class="muted">Improve players without making the career impossible.</p></div><button data-trainall>Train Squad</button></div><div class="table"><table><tr><th>Player</th><th>Pos</th><th>OVR</th><th>Age</th><th>Morale</th><th>Value</th><th></th></tr>${career.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td><b>${p.ov}</b></td><td>${p.age}</td><td>${p.morale}%</td><td>$${p.value}m</td><td><button class="secondary" data-train="${i}">+1 OVR ($2m)</button></td></tr>`).join("")}</table></div></div>`);

function repairCareerSquad(){
  if(!career) return;
  if(!Array.isArray(career.players)) career.players=[];
  const clean=[];
  const seen=new Set();
  for(const p of career.players){
    if(!p || typeof p!=="object" || !p.name) continue;
    const key=String(p.name).trim().toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    clean.push({...p,name:String(p.name).trim()});
  }
  // Restore the club's genuine starting squad once, then preserve every unique
  // transfer the manager has made. This repairs older saves without deleting Mbappe,
  // Bellingham, Vinicius Jr, or any other player the user actually signed.
  const clubName=CLUBS[career.club]?.name;
  const base=PLAYER_POOL.filter(x=>x[4]===clubName).map(x=>({name:x[0],pos:x[1],ov:x[2],value:x[3],morale:80,age:21}));
  const byName=new Map(clean.map(p=>[p.name.toLowerCase(),p]));
  const merged=[];
  for(const p of base){
    const key=p.name.toLowerCase();
    if(byName.has(key)) merged.push(byName.get(key));
    else merged.push(p);
  }
  for(const p of clean){
    if(!base.some(x=>x.name.toLowerCase()===p.name.toLowerCase())) merged.push(p);
  }
  career.players=merged;
  career._squadRepairVersion=6;
  save();
}

  <div class="card pitchCard"><div class="pitchTitle"><b>${formation}</b><span>${t.vision||'Standard'} · ${t.buildUp||'Balanced'} · ${t.defApproach||'Balanced'}</span></div><div class="tacticalPitch"><div class="pitchHalf"></div><div class="pitchMid"></div><div class="pitchCircle"></div><div class="box left"></div><div class="box right"></div>${pitch}</div><p class="muted small">Drag a player anywhere on the pitch to preview your positioning. Change formation to reset the tactical shape.</p></div>
  <div class="card tacticPanel"><h3>Tactical Vision</h3>
   <label>Formation${opts('formation',['4-3-3','4-2-3-1','4-4-2','3-5-2','5-3-2','3-4-2-1'])}</label>
   <label>Vision${opts('vision',['Standard','Possession','Wing Play','Counter Attack','High Pressing','Park The Bus','Kick & Rush'])}</label>
   <label>Build-Up${opts('buildUp',['Balanced','Close Support','Counter'])}</label>
   <label>Defensive Approach${opts('defApproach',['Deep','Balanced','High','Aggressive'])}</label>
   <label>Line Height${opts('lineHeight',['Low','Medium','High'])}</label>
   <h3>Key Player Roles</h3>${roleNames.map((pos,i)=>`<label>${pos}${opts('role'+i,roleOptions)}</label>`).join('')}
  </div>
  <div class="card radarCard"><h3>Tactical Breakdown</h3><div class="radar"><svg viewBox="0 0 100 100"><polygon points="50,12 83,31 83,69 50,88 17,69 17,31" class="radarGrid"></polygon><polygon points="50,25 72,37 72,63 50,75 28,63 28,37" class="radarGrid"></polygon><polygon points="${points}" class="radarFill"></polygon><polyline points="${points} ${points.split(' ')[0]}" class="radarLine"></polyline></svg>${axes}</div><div class="breakGrid">${Object.entries(breakdown).map(([k,v])=>`<div><span>${k}</span><b>${v}</b><i><em style="width:${v}%"></em></i></div>`).join('')}</div></div>
 </div>`);
}
function champions(){
 const q=career.champions||{qualified:false,phase:[],played:0,pts:0,wins:0,draws:0,losses:0,gf:0,ga:0};
 return layout(`<div class="card"><h2>🏆 UEFA Champions League</h2>
 <p class="muted">Qualify through domestic success. The game uses an 8-match league phase.</p>
 <div class="stats"><div class="stat"><span class="muted">Status</span><b>${q.qualified?"Qualified":"Not qualified"}</b></div><div class="stat"><span class="muted">Points</span><b>${q.pts}</b></div><div class="stat"><span class="muted">Record</span><b>${q.wins}-${q.draws}-${q.losses}</b></div><div class="stat"><span class="muted">GD</span><b>${q.gf-q.ga}</b></div></div>
 ${q.qualified?q.phase.map((f,i)=>`<div class="notice"><b>Match ${i+1}</b> · ${f.home?"🏠":"✈️"} ${EURO_CLUBS[f.op].name} — ${f.played?f.result+" "+f.score:(i===q.played?`<button data-ucl-sim>Simulate</button>`:"Scheduled")}</div>`).join(""):`<div class="notice">Finish the domestic season strongly to qualify for next year's Champions League.</div>`}
 </div>`);
}
function render(){
 const root=document.getElementById("root");
 root.innerHTML=career
  ? (page==="dashboard"?dashboard()
   :page==="squad"?squad()
   :page==="fixtures"?fixtures()
   :page==="table"?table()
   :page==="transfers"?transfers()
   :page==="tactics"?tactics()
   :page==="champions"?champions()
   :page==="match"?matchView()
   :dashboard())
  :home();
 bind();
}
function bind(){
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startCareer(Number(b.dataset.start)));
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});
 document.querySelectorAll("[data-new]").forEach(b=>b.onclick=newCareer);
 document.querySelectorAll("[data-next-season]").forEach(b=>b.onclick=nextSeason);
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=startMatch);
 document.querySelectorAll("[data-sim]").forEach(b=>b.onclick=simulateNext);
 document.querySelectorAll("[data-trainall]").forEach(b=>b.onclick=trainAll);
 document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>trainPlayer(Number(b.dataset.train)));
 document.querySelectorAll("[data-bid]").forEach(b=>{
    b.type='button';
    b.onclick=null;
    b.onclick=(e)=>{
      e.preventDefault();
      e.stopImmediatePropagation();
      const idx=Number(b.getAttribute('data-bid'));
      if(Number.isInteger(idx)) bidForPlayer(idx);
    };
  });
 const marketSearch=document.querySelector('[data-market-search]');
 const marketPos=document.querySelector('#marketPos');
 const applyMarketFilter=()=>{
   window.marketQuery=(marketSearch?.value||'').trim().toLowerCase();
   window.marketPos=marketPos?.value||'';
   document.querySelectorAll('.marketRow').forEach(row=>{
     const text=row.dataset.marketText||'';
     const okText=!window.marketQuery||text.includes(window.marketQuery);
     const okPos=!window.marketPos||row.dataset.marketPos===window.marketPos;
     row.style.display=(okText&&okPos)?'':'none';
   });
 };
 document.querySelector('[data-market-filter]')?.addEventListener('click',applyMarketFilter);
 marketSearch?.addEventListener('keydown',e=>{if(e.key==='Enter')applyMarketFilter();});
 document.querySelectorAll("[data-forfeit]").forEach(b=>b.onclick=forfeit);
 document.querySelectorAll("[data-tactic]").forEach(s=>{
   s.value=(career.tactics&&career.tactics[s.dataset.tactic])||s.value;
   s.onchange=()=>{career.tactics[s.dataset.tactic]=s.value;save()};
 });
 document.querySelectorAll("[data-ucl-sim]").forEach(b=>b.onclick=simulateUCL);
 document.querySelectorAll("[data-drag-player]").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("text/plain",el.dataset.dragPlayer));
 const pitch=document.querySelector('.tacticalPitch');
 if(pitch){pitch.ondragover=e=>e.preventDefault();pitch.ondrop=e=>{e.preventDefault();const el=document.querySelector(`[data-drag-player="${e.dataTransfer.getData('text/plain')}"]`);if(!el)return;const r=pitch.getBoundingClientRect();el.style.left=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100))+'%';};}
}


career=load();
if(career && (!CLUBS[career.club] || !Array.isArray(career.players) || !Array.isArray(career.fixtures))) {
 career=null;
 try{localStorage.removeItem("fc_new_career_v49")}catch(e){}
}
if(career){
 career.tactics=career.tactics||{formation:"4-3-3",vision:"Standard",buildUp:"Balanced",defApproach:"Balanced",lineHeight:"Medium"};
 // A domestic career must always use exactly 20 Premier League clubs and 38 fixtures.
 // Rebuild an invalid/old schedule before the user starts testing.
 const validSchedule=Array.isArray(career.leagueSchedule) && career.leagueSchedule.length===38 && Array.isArray(career.fixtures) && career.fixtures.length===38 && career.table?.length===20;
 if(!validSchedule){ career.table=CLUBS.map(x=>({name:x.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})); makeFixtures(); }
 repairCareerSquad();
}
render();
</script>
</body>
</html>
